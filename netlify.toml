[build]
  # The build ends with scripts/prerender.mjs, which drives a headless Chromium
  # over the built site to write one HTML file per route.
  command = "npx playwright install chromium && npm run build"
  publish = "dist"

[build.environment]
  # Puts the browser download inside node_modules, which Netlify caches between
  # builds. Left at the default it lands in ~/.cache, which is not cached, and
  # every deploy would re-download Chromium.
  PLAYWRIGHT_BROWSERS_PATH = "0"

# The contact form uses Netlify Forms and needs no environment variables. Netlify detects
# it from public/__forms.html at deploy time; submissions land in the Forms dashboard, and
# email notifications are configured there rather than in this repo.

# CSP notes (intentional — do not remove without testing):
# - style-src 'unsafe-inline' is REQUIRED: React/Framer Motion inline styles and ProgressArc
#   widget set element.style / style attributes at runtime.
# - script-src 'unsafe-inline' is REQUIRED: static JSON-LD in index.html and PageMeta-injected
#   application/ld+json scripts. ProgressArc itself loads from staging-cdn (external).
# - connect-src includes wss://*.progressarc.io for the ProgressArc chat WebSocket.

# Keep old Netlify subdomain traffic on the production custom domain.
[[redirects]]
  from = "https://zaviahorg.netlify.app/*"
  to = "https://zaviah.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://zaviahorg.netlify.app"
  to = "https://zaviah.org/"
  status = 301
  force = true

[[headers]]
  for = "/assets/og-share.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "image/jpeg"

[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Every real route is prerendered to its own file, so the old SPA fallback
# (/* -> /index.html 200) is gone. It answered 200 for genuinely missing pages,
# which is a soft 404: crawlers indexed them and users got the homepage shell.
#
# This rule is not forced, so Netlify serves a matching file when one exists and
# only falls through to here when nothing does. React still boots on 404.html,
# so client-side navigation away from the page works normally.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://staging-cdn.progressarc.io https://*.progressarc.io https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://staging-cdn.progressarc.io https://*.progressarc.io wss://*.progressarc.io https://plausible.io; frame-src 'self' https://staging-cdn.progressarc.io https://*.progressarc.io; worker-src 'self' blob:; media-src 'self' https://staging-cdn.progressarc.io https://*.progressarc.io; form-action 'self';"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
