<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Form definitions</title>
  </head>
  <body>
    <!--
      Netlify detects forms by parsing the HTML it receives at deploy time. This site is a
      Vite SPA, so the real contact form only exists after React renders in the browser and
      the build bot would never see it. This file is the static declaration it scans instead;
      the live form in src/components/Contact.tsx posts to it by name.

      Every field the form submits must be listed here, or Netlify drops it from the
      submission. Keep this in sync with the contact form.
    -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="consent" />
    </form>
  </body>
</html>
